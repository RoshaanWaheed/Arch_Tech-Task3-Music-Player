<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arch Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <section class="player" aria-label="Now playing">
    <canvas id="viz" aria-hidden="true"></canvas>
    <div class="meta"><h1 class="title" id="title">Pick a track</h1><p class="artist" id="artist">Choose from the playlist to start</p></div>
    <div class="seek"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    <div class="controls">
      <button class="ic" id="shuffle" aria-label="Shuffle" aria-pressed="false"></button>
      <button class="ic" id="prev" aria-label="Previous track"></button>
      <button class="ic big" id="play" aria-label="Play"></button>
      <button class="ic" id="next" aria-label="Next track"></button>
      <button class="ic" id="repeat" aria-label="Repeat current track" aria-pressed="false"></button>
    </div>
    <div class="vol"><button class="ic" id="mute" aria-label="Mute"></button><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></div>
    <p class="hint">Space plays or pauses, N next, P previous</p>
  </section>

  <section class="lib" aria-label="Playlist">
    <div class="lib-head"><h2>Playlist</h2>
      <label class="add"><input id="files" type="file" accept="audio/*" multiple hidden>Add your own audio files</label></div>
    <input class="search" id="q" type="search" placeholder="Search by title, artist or category" aria-label="Search tracks">
    <div class="chips" id="chips"></div>
    <ul id="list"></ul>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
